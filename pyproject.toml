[project]
name = "vhs-photo-recovery"
version = "0.1.0"
description = "Recover still photographs from videos of slideshows"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
dependencies = [
    "scenedetect>=0.6.5,<0.8",
    "opencv-python>=4.8,<5",
    "numpy>=1.26,<3",
]

[project.scripts]
vhs-recover = "vhs_photo_recovery.cli:main"
vhs-enhance = "vhs_photo_recovery.enhance:main"

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.9,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vhs_photo_recovery"]

[tool.pylint.main]
extension-pkg-allow-list = ["cv2"]
generated-members = ["cv2.*"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
